name: devflow

services:
  postgres:
    image: postgres:17-alpine
    container_name: devflow-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow} -d ${POSTGRES_DB:-devflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - devflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DEVFLOW_JWT_SECRET: ${DEVFLOW_JWT_SECRET:?DEVFLOW_JWT_SECRET is required}
      DEVFLOW_JWT_ACCESS_TOKEN_MINUTES: ${DEVFLOW_JWT_ACCESS_TOKEN_MINUTES:-15}
      DEVFLOW_JWT_REFRESH_TOKEN_DAYS: ${DEVFLOW_JWT_REFRESH_TOKEN_DAYS:-7}
      DEVFLOW_CORS_ALLOWED_ORIGINS: ${DEVFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - devflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-}
    container_name: devflow-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - devflow

volumes:
  postgres-data:

networks:
  devflow:
    driver: bridge
