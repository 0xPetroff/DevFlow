server {
    # IPv4 only, so the container healthcheck has to name 127.0.0.1: localhost resolves to ::1
    # first inside the container and nothing is listening there.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # A location that declares its own add_header discards every inherited one, so the
        # security headers are repeated per location rather than set once on the server.
        include /etc/nginx/conf.d/security-headers.inc;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Content-hashed bundles are safe to cache indefinitely; index.html must not be.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;

        # Set in one header rather than with `expires`, which would emit its own Cache-Control
        # alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
