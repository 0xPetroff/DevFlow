spring:
  application:
    name: devflow-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devflow}
    username: ${SPRING_DATASOURCE_USERNAME:devflow}
    password: ${SPRING_DATASOURCE_PASSWORD:devflow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

server:
  # Platforms that assign a port inject it as PORT and expect the process to bind it. Hardcoding
  # 8080 passes the build and then fails the health check, which reads as a broken application
  # rather than a misconfigured port.
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

devflow:
  jwt:
    secret: ${DEVFLOW_JWT_SECRET}
    access-token-minutes: ${DEVFLOW_JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${DEVFLOW_JWT_REFRESH_TOKEN_DAYS:7}
    issuer: devflow
  cors:
    allowed-origins: ${DEVFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173}

info:
  app:
    name: DevFlow API
    version: '@project.version@'

logging:
  level:
    com.devflow: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
